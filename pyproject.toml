[project]
name = "djing"
version = "0.1.0"
description = "Virtual MIDI bridge between an agent and Mixxx (deck B), with state feedback"
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa>=1.0.0",
    "mido>=1.3",
    "numpy>=2.5.4",
    "python-rtmidi>=1.5",
    "soundfile>=0.14.0",
]

[tool.uv]
package = false
