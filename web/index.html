<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>djing web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="mark"><b>dj</b>ing<small>web</small></span>
  <button id="start" class="primary">Démarrer l'audio</button>
  <details class="setup">
    <summary>Sorties audio</summary>
    <div class="popover">
      <label>MAIN <select id="mainDevice" disabled><option>défaut</option></select></label>
      <label>Casque <select id="cueDevice" disabled><option>défaut</option></select></label>
      <div class="row">
        <button id="labels" class="quiet" title="Chrome ne donne le nom des sorties qu'après une autorisation micro">Noms des sorties</button>
        <button id="toneMain" class="quiet">Bip MAIN (1-2)</button>
        <button id="toneCue" class="quiet">Bip casque (3-4)</button>
      </div>
    </div>
  </details>
  <span id="out" class="pill">sortie : —</span>
  <span id="midi" class="pill">MIDI : —</span>
  <span class="spacer"></span>
  <span id="recTime" class="pill" hidden>0:00</span>
  <a id="recFile" hidden></a>
  <button id="rec" title="Enregistre le MAIN en WebM Opus ; un second appui arrête">REC</button>
</header>

<main class="stage">
  <section class="deck" data-deck="0"></section>
  <section class="mixer">
    <h2>Mixer</h2>
    <label>Master <input id="mainVol" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>Casque <input id="cueVol" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label title="Casque : 0 = cue seul, 1 = master seul">Cue / Master <input id="cueMix" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label class="check" title="Casque : cue en mono à gauche, master en mono à droite"><input id="splitCue" type="checkbox"> split casque</label>
    <label class="check"><input id="rateInvert" type="checkbox" checked> pitch inversé</label>
    <div class="meters" title="Niveaux crête, −48 à 0 dBFS">
      <span class="vu" data-meter="vu" data-deck="0"><i></i>A</span>
      <span class="vu" data-meter="vu" data-deck="1"><i></i>B</span>
      <span class="vu" data-meter="vu.mainLeft"><i></i>L</span>
      <span class="vu" data-meter="vu.mainRight"><i></i>R</span>
    </div>
    <span id="limit">LIMIT</span>
    <div class="xfader">
      <input id="xfader" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="Crossfader">
      <div class="ends"><span>A</span><span class="hint">crossfader</span><span>B</span></div>
    </div>
  </section>
  <section class="deck" data-deck="1"></section>
</main>

<section id="sampler" class="library">
  <div class="row">
    <strong>Sampler</strong>
    <label>Volume <input id="samplerVolume" type="range" min="0" max="1" step="0.01" value="1"></label>
    <button id="samplerPfl" title="Sampler dans le casque">🎧 PFL</button>
    <span class="hint">1 à 8 : pads du deck A, 9 à 16 : deck B (mode sampler) ; glisser un titre de la bibliothèque sur un emplacement</span>
  </div>
  <div id="samplerSlots" class="slots"></div>
</section>

<section id="library" class="library">
  <div class="row">
    <button id="libraryPick">Choisir le dossier</button>
    <button id="libraryReopen" hidden>Rouvrir</button>
    <span id="libraryStatus" class="hint">aucun dossier</span>
    <span id="analysisProgress" class="hint"></span>
  </div>
  <div class="row">
    <input id="librarySearch" type="search" placeholder="Rechercher (artiste, titre, chemin)" aria-label="Rechercher dans la bibliothèque">
    <label>Titres compatibles avec le deck <select id="libraryDeck"><option value="0">A</option><option value="1">B</option></select></label>
  </div>
  <div class="tracks" tabindex="0">
    <table>
      <thead><tr><th data-sort="artist">Artiste</th><th data-sort="title">Titre</th><th>Chemin</th><th data-sort="bpm">BPM</th><th data-sort="key">Tonalité</th><th data-sort="duration">Durée</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section id="playlists" class="library">
  <div class="row">
    <strong>Playlists</strong>
    <select id="playlistSelect" disabled></select>
    <button id="playlistNew">Nouvelle</button>
    <button id="playlistRename" disabled>Renommer</button>
    <button id="playlistDelete" disabled>Supprimer</button>
    <button id="playlistExport" disabled title="Chemins relatifs au dossier de la bibliothèque, UTF-8">Exporter M3U8</button>
    <button id="autoDj" title="Enchaîner la playlist affichée (AUTODJ sur la platine)">AutoDJ</button>
    <span id="autoDjStatus" class="hint"></span>
  </div>
  <div id="playlistEdit" class="row" hidden>
    <input id="playlistName" type="text" maxlength="100" aria-label="Nom de la playlist">
    <button id="playlistNameOk">OK</button>
    <button id="playlistNameCancel">Annuler</button>
  </div>
  <div id="playlistConfirm" class="row" hidden>
    <span></span>
    <button id="playlistConfirmYes">Supprimer</button>
    <button id="playlistConfirmNo">Annuler</button>
  </div>
  <div id="playlistDrop" class="tracks">
    <table>
      <thead><tr><th>#</th><th>Titre</th><th>Chemin</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="playlistHint" class="hint"></p>
  </div>
</section>

<div id="log"></div>

<template id="deckTpl">
  <div class="deck-head">
    <h2></h2>
    <div class="title">
      <div class="name">Glisser un fichier ici</div>
      <div class="sub"><span class="key" title="Tonalité (Camelot)">—</span><span class="master"></span></div>
    </div>
    <div class="clock" title="Temps écoulé / durée, puis temps restant">
      <span class="time">0:00.0 / 0:00</span>
      <span class="remain">−0:00.0</span>
    </div>
    <div class="tempo" title="Tempo entendu (BPM analysé × pitch) et pitch">
      <span class="bpm">BPM —</span>
      <span class="rate">±0.00 %</span>
    </div>
  </div>
  <div class="waveform">
    <canvas class="overview" width="1000" height="36" title="Vue d'ensemble : cliquer pour sauter"></canvas>
    <canvas class="scroll" width="1000" height="120"></canvas>
    <div class="row zoom">
      <span class="zoom-label">8 temps</span>
      <button data-act="waveform.zoomOut" title="Zoom arrière : plus de temps visibles">−</button>
      <button data-act="waveform.zoomIn" title="Zoom avant : moins de temps visibles">+</button>
    </div>
  </div>
  <div class="transport">
    <button data-act="cue">CUE</button>
    <button data-act="play" data-led="play">PLAY</button>
    <button data-act="sync" data-led="sync" title="Caler tempo et phase sur le deck maître">SYNC</button>
    <div class="switches">
      <button data-act="pfl" data-led="pfl" title="Pré-écoute au casque">🎧 PFL</button>
      <button data-act="keylock" data-led="keylock">KEYLOCK</button>
      <button data-act="slip" data-led="slip" title="Slip : scratch, boucle et hotcue maintenu reprennent là où la lecture serait">SLIP</button>
      <button data-act="quantize" data-led="quantize" title="Calage des repères sur le temps le plus proche">Q</button>
      <button data-act="shift.sync" title="Choisir ce deck comme maître (SHIFT + SYNC)">MAÎTRE</button>
      <button data-act="vinyl" data-led="vinyl" title="Jog en mode vinyle (scratch)">VINYL</button>
    </div>
  </div>
  <div class="row loops">
    <span class="label">LOOP</span>
    <button data-act="loopIn" data-led="loopIn" title="Début de boucle (allumé : boucle active)">IN</button>
    <button data-act="loopOut" title="Fin de boucle et activation, ou sortie de boucle">OUT</button>
    <button data-act="reloop" title="Sortir de la boucle active" disabled>SORTIR</button>
    <button data-act="shift.loopIn" title="Boucle deux fois plus courte">½</button>
    <button data-act="shift.loopOut" title="Boucle deux fois plus longue">×2</button>
    <button data-act="autoLoop.0.5" title="Boucle de 1/2 temps">1/2</button>
    <button data-act="autoLoop.1" title="Boucle de 1 temps">1</button>
    <button data-act="autoLoop.2" title="Boucle de 2 temps">2</button>
    <button data-act="autoLoop.4" title="Boucle de 4 temps">4</button>
    <button data-act="autoLoop.8" title="Boucle de 8 temps">8</button>
    <button data-act="autoLoop.16" title="Boucle de 16 temps">16</button>
  </div>
  <div class="pad-area">
    <div class="pad-pages"></div>
  </div>
  <div class="knobs">
    <label>Gain<input data-knob="gain" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>High<input data-knob="high" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>Mid<input data-knob="mid" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>Low<input data-knob="low" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>Filtre<input data-knob="filter" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>Volume<input data-knob="volume" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label>Pitch<input data-knob="rate" type="range" min="-1" max="1" step="0.001" value="0"></label>
  </div>
  <details class="more">
    <summary>Plus : fichier, grille, plage du pitch, transposition</summary>
    <div class="row">
      <input type="file" accept="audio/*">
    </div>
    <div class="row grid">
      <span class="hint">Grille</span>
      <button data-act="grid.half" title="BPM ÷ 2">÷2</button>
      <button data-act="grid.double" title="BPM × 2">×2</button>
      <button data-act="grid.earlier" title="Grille 10 ms plus tôt">−10 ms</button>
      <button data-act="grid.later" title="Grille 10 ms plus tard">+10 ms</button>
      <button data-act="shift.quantize" title="Plage du pitch : 8, 16, 50 % (SHIFT + Q)">plage</button>
      <span class="hint range">±8 %</span>
    </div>
    <div class="row">
      <label>Transposition <input data-knob="transpose" type="range" min="-12" max="12" step="1" value="0"></label>
      <span class="hint transpose">±0 dt</span>
      <span class="hint latency">latence 0 ms</span>
    </div>
  </details>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
