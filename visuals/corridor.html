<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORRIDOR</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="audio-client.js?v=2"></script>
<script>
(function () {

  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H, DIAG;

  function resize() {
    W = c.width  = innerWidth;
    H = c.height = innerHeight;
    DIAG = Math.sqrt(W * W + H * H) / 2;
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ── Thermal palette (shared with sunburst) : 0 = cold, 1 = warm ─────────────
  var THERMO = [
    [20,  40,  220],
    [60,  10,  200],
    [160, 10,  255],
    [255, 30,  80],
    [255, 110, 10],
    [255, 200, 20],
    [255, 245, 180]
  ];

  function thermoRgb(t) {
    t = Math.max(0, Math.min(1, t));
    var steps = THERMO.length - 1, pos = t * steps;
    var lo = Math.min(Math.floor(pos), steps - 1), f = pos - lo;
    var a = THERMO[lo], b = THERMO[lo + 1];
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }

  function towardWhite(col, k) {
    return [
      Math.round(col[0] + (255 - col[0]) * k),
      Math.round(col[1] + (255 - col[1]) * k),
      Math.round(col[2] + (255 - col[2]) * k)
    ];
  }

  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
  }

  function smoothstep(e0, e1, x) {
    var t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  // ── Corridor ─────────────────────────────────────────────────────────────
  // N squares evenly spaced in depth. depth 0 = far (centre), 1 = past the
  // screen edges. They loop forever : nothing is spawned or killed, so the
  // flow never pops. Squares crossing the edges light the Ambilight strips.
  //   speed  ← level, plus a forward lurch on each attack (punch)
  //   border ← low      opacity ← mid      spiral twist ← high
  //   colour ← tone (one hue at a time)
  var N = 11;
  var flow  = 0;   // global depth offset, integrated (never jumps)
  var twist = 0;   // spiral amount, integrated
  var spin  = 0;   // slow global rotation

  function drawCorridor(a, col, dt) {
    flow  += dt * (0.06 + a.low * 0.14 + a.punch * 0.60);
    twist += dt * (a.high - 0.35) * 0.6;          // hats wind the spiral, calm unwinds it
    twist  = Math.max(-1.2, Math.min(1.2, twist));
    spin  += dt * 0.05;

    var nearCol = towardWhite(col, 0.15 + a.punch * 0.35);

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.lineJoin = 'miter';

    for (var i = 0; i < N; i++) {
      var d = (flow + i / N) % 1;                  // 0 far → 1 gone
      // quadratic = perspective ; the whole corridor inflates with the bass
      var size = DIAG * (0.03 + d * d * 1.25) * (1 + a.low * 0.12 + a.punch * 0.08);
      var fade = smoothstep(0.0, 0.22, d) * (1 - smoothstep(0.86, 1.0, d));
      if (fade < 0.01) continue;

      var border = (2 + d * 34) * (0.35 + a.low * 1.7) + a.punch * 30 * d;
      var alpha  = fade * (0.45 + a.mid * 0.5);

      ctx.save();
      ctx.rotate(Math.PI / 4 + spin + twist * d * 1.6);
      ctx.strokeStyle = rgba(d > 0.55 ? nearCol : col, Math.min(0.95, alpha));
      ctx.lineWidth   = border;
      ctx.beginPath();
      ctx.rect(-size, -size, size * 2, size * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ── Kick shockwaves ──────────────────────────────────────────────────────
  // One thick bright square per detected kick, racing from the centre to past
  // the edges in ≈0.45 s : the clearest possible "boom", and it hits the
  // Ambilight strips on its way out.
  var waves = [];
  var WAVE_S = 0.45;

  function drawWaves(a, col, dt) {
    if (a.hit > 0) {
      waves.push({ t: 0, s: a.hit, rot: Math.PI / 4 + spin + twist * 0.8 });
      if (waves.length > 4) waves.shift();
    }
    var bright = towardWhite(col, 0.55);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.lineJoin = 'miter';
    for (var i = waves.length - 1; i >= 0; i--) {
      var w = waves[i];
      w.t += dt;
      var p = w.t / WAVE_S;
      if (p >= 1) { waves.splice(i, 1); continue; }
      var e = 1 - Math.pow(1 - p, 3);              // ease-out : fast start, glides out
      var size = DIAG * (0.06 + e * 1.35);
      ctx.save();
      ctx.rotate(w.rot);
      ctx.strokeStyle = rgba(bright, w.s * Math.pow(1 - p, 1.2));
      ctx.lineWidth   = 8 + 70 * w.s * (1 - e);
      ctx.beginPath();
      ctx.rect(-size, -size, size * 2, size * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ── Edge glow : keeps the Ambilight fed even between squares ──────────────
  function drawEdges(a, col) {
    var depth = Math.min(W, H) * 0.22;
    var alpha = Math.min(0.95, 0.15 + a.low * 0.45 + a.punch * 0.45);
    var edges = [
      [0, 0, 0, depth,          0, 0, W, depth],          // top
      [0, H, 0, H - depth,      0, H - depth, W, depth],  // bottom
      [0, 0, depth, 0,          0, 0, depth, H],          // left
      [W, 0, W - depth, 0,      W - depth, 0, depth, H]   // right
    ];
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (var i = 0; i < 4; i++) {
      var e = edges[i];
      var g = ctx.createLinearGradient(e[0], e[1], e[2], e[3]);
      g.addColorStop(0, rgba(col, alpha));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.fillRect(e[4], e[5], e[6], e[7]);
    }
    ctx.restore();
  }

  // ── Vanishing point : soft glow where squares are born ───────────────────
  function drawCore(a, col) {
    var r = Math.min(W, H) * (0.10 + a.level * 0.05 + a.punch * 0.06);
    var g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
    g.addColorStop(0, rgba(towardWhite(col, 0.5), 0.35 + a.punch * 0.3));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.fillRect(W / 2 - r, H / 2 - r, r * 2, r * 2);
  }

  // ── Render ───────────────────────────────────────────────────────────────
  var last = 0;

  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    var a   = AudioFeed.update(dt);
    var col = thermoRgb(a.tone);

    // Background never black (12 % floor of the current hue)
    var lum = 0.12 + a.low * 0.18 + a.punch * 0.22;
    ctx.fillStyle = 'rgb(' +
      Math.round(col[0] * lum) + ',' +
      Math.round(col[1] * lum) + ',' +
      Math.round(col[2] * lum) + ')';
    ctx.fillRect(0, 0, W, H);

    drawCore(a, col);
    drawCorridor(a, col, dt);
    drawWaves(a, col, dt);
    drawEdges(a, col);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

}());
</script>
</body>
</html>
