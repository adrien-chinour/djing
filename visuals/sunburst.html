<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUNBURST</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="audio-client.js?v=3"></script>
<script>
(function () {

  var TAU = Math.PI * 2;
  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H, CX, CY, DIAG, MIN;

  function resize() {
    W = c.width  = innerWidth;
    H = c.height = innerHeight;
    CX = W / 2; CY = H / 2;
    DIAG = Math.sqrt(CX * CX + CY * CY) * 1.05;   // rays always reach past the corners
    MIN  = Math.min(W, H);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ── Thermal palette (shared with corridor) ───────────────────────
  var THERMO = [
    [20,  40,  220],
    [60,  10,  200],
    [160, 10,  255],
    [255, 30,  80],
    [255, 110, 10],
    [255, 200, 20],
    [255, 245, 180]
  ];

  function thermoRgb(t) {
    t = Math.max(0, Math.min(1, t));
    var steps = THERMO.length - 1, pos = t * steps;
    var lo = Math.min(Math.floor(pos), steps - 1), f = pos - lo;
    var a = THERMO[lo], b = THERMO[lo + 1];
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }
  function scale(col, k) {
    return [Math.min(255, Math.round(col[0] * k)), Math.min(255, Math.round(col[1] * k)), Math.min(255, Math.round(col[2] * k))];
  }
  function towardWhite(col, k) {
    return [
      Math.round(col[0] + (255 - col[0]) * k),
      Math.round(col[1] + (255 - col[1]) * k),
      Math.round(col[2] + (255 - col[2]) * k)
    ];
  }
  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
  }
  function rgb(col) { return 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')'; }

  // ── Rays ─────────────────────────────────────────────────────────────────
  // RAYS bright wedges on a dark-tinted background, same hue. Rotating, they
  // sweep a light/dark alternation all around the screen edges (Ambilight).
  //   rotation ← level (+ lurch on punch)   width ← low
  //   spiral   ← high                        brightness ← mid
  var RAYS  = 12;
  var STEPS = 14;          // points along each curved edge
  var rot   = 0;           // integrated rotation
  var curl  = 0;           // integrated spiral amount (radians at the edge)

  function rayEdge(angle, out) {
    // Fills `out` with points from centre to DIAG along a spiral line
    for (var s = 0; s <= STEPS; s++) {
      var k = s / STEPS;
      var r = k * DIAG;
      var a = angle + curl * k * k;
      out[s * 2]     = CX + Math.cos(a) * r;
      out[s * 2 + 1] = CY + Math.sin(a) * r;
    }
  }
  var edgeA = new Float32Array((STEPS + 1) * 2);
  var edgeB = new Float32Array((STEPS + 1) * 2);

  function drawRays(a, col, dt) {
    rot  += dt * (0.12 + a.level * 0.25 + a.punch * 1.4);
    var curlTarget = (a.high - 0.3) * 1.6;           // hats bend the rays into a spiral
    curl += (curlTarget - curl) * (1 - Math.exp(-dt / 1.2));

    var slot  = TAU / RAYS;
    var duty  = 0.22 + a.low * 0.30 + a.punch * 0.12; // share of each slot that is bright
    var width = slot * Math.min(0.75, duty);

    var bright = scale(col, 0.38 + a.mid * 0.32 + a.punch * 0.30);
    ctx.fillStyle = rgb(bright);

    for (var i = 0; i < RAYS; i++) {
      var a0 = rot + i * slot - width / 2;
      rayEdge(a0, edgeA);
      rayEdge(a0 + width, edgeB);
      ctx.beginPath();
      ctx.moveTo(edgeA[0], edgeA[1]);
      for (var s = 1; s <= STEPS; s++) ctx.lineTo(edgeA[s * 2], edgeA[s * 2 + 1]);
      for (var s2 = STEPS; s2 >= 0; s2--) ctx.lineTo(edgeB[s2 * 2], edgeB[s2 * 2 + 1]);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ── Kick burst : a bright star racing from the centre past the edges ──────
  var bursts = [];
  var BURST_S = 0.5;

  function drawBursts(a, col, dt) {
    if (a.hit > 0) {
      bursts.push({ t: 0, s: a.hit, rot: rot + Math.PI / RAYS });   // spikes between the rays
      if (bursts.length > 4) bursts.shift();
    }
    var light = towardWhite(col, 0.6);
    for (var i = bursts.length - 1; i >= 0; i--) {
      var b = bursts[i];
      b.t += dt;
      var p = b.t / BURST_S;
      if (p >= 1) { bursts.splice(i, 1); continue; }
      var e = 1 - Math.pow(1 - p, 3);
      var outer = MIN * 0.08 + e * DIAG * 1.1;
      var inner = outer * (0.55 + 0.3 * e);            // star thins out as it grows
      ctx.save();
      ctx.strokeStyle = rgba(light, b.s * Math.pow(1 - p, 1.3));
      ctx.lineWidth   = 6 + 50 * b.s * (1 - e);
      ctx.lineJoin    = 'miter';
      ctx.beginPath();
      for (var k = 0; k < RAYS * 2; k++) {
        var r  = k % 2 ? inner : outer;
        var an = b.rot + k * Math.PI / RAYS;
        var x  = CX + Math.cos(an) * r, y = CY + Math.sin(an) * r;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Hub : dark disc + bright rim beating with the bass ───────────────────
  function drawHub(a, col, bg) {
    var r = MIN * (0.09 + a.low * 0.04 + a.punch * 0.03);
    ctx.fillStyle = rgb(bg);
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(towardWhite(col, 0.35), 0.55 + a.low * 0.3 + a.punch * 0.15);
    ctx.lineWidth = 4 + a.low * 14 + a.punch * 10;
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.stroke();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  var last = 0;

  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    var a   = AudioFeed.update(dt);
    var col = thermoRgb(a.tone);

    // Dark wedges = background, never black (13 % floor of the hue)
    var bg = scale(col, 0.13 + a.low * 0.08 + a.punch * 0.10);
    ctx.fillStyle = rgb(bg);
    ctx.fillRect(0, 0, W, H);

    drawRays(a, col, dt);
    drawBursts(a, col, dt);
    drawHub(a, col, bg);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

}());
</script>
</body>
</html>
