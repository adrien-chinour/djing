<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Visuels · contrôle</title>
<link rel="stylesheet" href="/style.css?v=1">
<style>
  #screen { margin: -6px 0 18px; }
  #screen a { font: 15px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; text-decoration: none; }
  #tools { margin-top: 18px; }
</style>
</head>
<body>
<header class="brand"><a class="mark" href="/">visuels<b>.</b></a><span class="where">contrôle</span></header>
<div id="trait" class="trait"><i id="traitBar"></i></div>

<div id="screen"></div>
<div id="status" class="status">connexion…</div>
<div id="error" class="error"></div>

<div id="deck"></div>

<section class="card">
  <h2>Scène affichée</h2>
  <div id="list" class="scenes"></div>
  <div id="tools" class="scenes"></div>
  <small>L'écran bascule aussitôt. Un outil remplace la scène le temps de l'afficher.</small>
</section>

<p class="hint"><span id="floor"></span> <a id="debug" href="/debug.html">Calibrage complet</a> sur ordinateur.</p>

<script src="/audio-client.js?v=5"></script>
<script src="/deck.js?v=1"></script>
<script>
!function () {
  var list = document.getElementById('list'), tools = document.getElementById('tools'), status = document.getElementById('status');
  var screenEl = document.getElementById('screen'), errorEl = document.getElementById('error');
  var trait = document.getElementById('trait'), traitBar = document.getElementById('traitBar');
  var known = '', active = null, sourceOn = null;

  // Served at /c/<id>/<token>: the token signs every switch.
  var m = /^\/c\/([0-9a-z]+)\/([^/]+)$/.exec(location.pathname);
  var session = m ? m[1] : AudioFeed.session, token = m ? m[2] : '';
  if (session !== 'local') {
    var url = location.origin + '/s/' + session;
    screenEl.innerHTML = 'Écran : <a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
  }
  document.getElementById('debug').href = '/debug.html?s=' + session;

  function button(name, cls) {
    var b = document.createElement('button');
    b.textContent = name;
    b.className = (cls || '') + (name === active ? ' active' : '');
    b.onclick = function () {
      fetch('/sessions/' + session + '/active/' + encodeURIComponent(name), {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) {
        if (r.ok) { errorEl.textContent = ''; return refresh(); }
        return r.text().then(function (t) { errorEl.textContent = (r.status === 403 ? 'Ce lien de contrôle n\'est plus valable. ' : '') + r.status + ' : ' + t; });
      });
    };
    return b;
  }

  function render(data) {
    var toolNames = data.tools || [];
    active = data.active;
    deck.setScene(active);
    deck.setStats({ switches: data.switches, screens: Math.max(0, data.screens - 1) });
    var key = data.visuals.join(',') + '|' + toolNames.join(',') + '|' + active;
    if (key === known) return;
    known = key;
    list.innerHTML = '';
    tools.innerHTML = '';
    data.visuals.forEach(function (name) { list.appendChild(button(name, '')); });
    toolNames.forEach(function (name) { tools.appendChild(button(name, 'tool')); });
  }

  function refresh() {
    return fetch('/visuals?s=' + session + '&_=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { known = ''; list.innerHTML = ''; });
  }

  AudioFeed.onSource = function (on) { sourceOn = on; };

  // ── Deck: the DJ view. The control page is itself a screen: it is not counted.
  var deck = Deck.mount(document.getElementById('deck'));
  var floorEl = document.getElementById('floor'), lastTick = Date.now();
  deck.setStats({ rate: null });
  AudioFeed.onHello = function (msg) {
    sourceOn = msg.source;
    deck.setScene(msg.active);
    deck.setStats({ since: msg.createdAt, screens: Math.max(0, msg.screens - 1), switches: msg.switches });
  };
  AudioFeed.onActive = function (visual) { active = visual; deck.setScene(visual); refresh(); };
  AudioFeed.onScreens = function (n) { deck.setStats({ screens: Math.max(0, n - 1) }); };

  function tick() {
    var now = Date.now(), dt = Math.min(0.1, (now - lastTick) / 1000);
    lastTick = now;
    var s = AudioFeed.update(dt), raw = s.raw, dbg = raw && raw.dbg;
    if (s.live) status.textContent = 'Son en direct · niveau ' + Math.round(s.level * 100) + ' %';
    else if (sourceOn === false) status.textContent = 'Aucune source : la page de capture est fermée. Simulation à 160 BPM.';
    else status.textContent = 'Pas de son reçu du serveur. Simulation à 160 BPM.';
    status.className = s.live ? 'status live' : 'status';
    traitBar.style.width = (s.level * 100) + '%';
    trait.className = s.live ? (s.punch > 0.5 ? 'trait hit' : 'trait') : 'trait idle';
    deck.update(dt, s);
    floorEl.textContent = dbg ? 'Plancher ' + (dbg.minRef - dbg.range) + ' dBFS (min-ref ' + dbg.minRef + ', range ' + dbg.range + ').' : '';
    requestAnimationFrame(tick);
  }

  refresh();
  setInterval(refresh, 2000);
  requestAnimationFrame(tick);
}();
</script>
</body>
</html>
