<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBILIGHT</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<iframe id="v" src="about:blank"></iframe>
<script src="/audio-client.js?v=4"></script>
<script>
!function () {
  // Screen page: served at / (local session) and /s/<id>. The active visual is pushed
  // by the server; the visual itself opens its own WebSocket on the same session.
  var iframe = document.getElementById('v');
  var current = null;

  function show(path) {
    if (!path || path === current) return;
    current = path;
    // Swap the src without reloading the parent page: no flash, no browser bar
    iframe.src = path + '?s=' + AudioFeed.session + '&_=' + Date.now();
  }

  AudioFeed.onHello = function (msg) { show(msg.activePath); };
  AudioFeed.onActive = function (visual, msg) { show(msg.path); };
}();
</script>
</body>
</html>
