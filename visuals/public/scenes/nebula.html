<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEBULA</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../audio-client.js?v=5"></script>
<script src="../gl-visual.js?v=2"></script>
<script type="x-shader/x-fragment" id="fs">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float uTime, uLevel, uLow, uMid, uHigh, uPunch, uHit, uTone, uDist, uHitDist;
uniform vec2 uRes;

// Volumetric nebula: the camera flies through a slab of fractal fog. The noise lattice is
// periodic along z (PERIOD cells), so the wrap of uDist at 64 is invisible.
#define STEPS 32
#define PERIOD 64.0
#define SPEED 1.0

float hash(vec3 p) {
  p = vec3(mod(p.x, 256.0), mod(p.y, 256.0), mod(p.z, PERIOD));   // periodic lattice
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
}
float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash(i), n100 = hash(i + vec3(1,0,0)), n010 = hash(i + vec3(0,1,0)), n110 = hash(i + vec3(1,1,0));
  float n001 = hash(i + vec3(0,0,1)), n101 = hash(i + vec3(1,0,1)), n011 = hash(i + vec3(0,1,1)), n111 = hash(i + vec3(1,1,1));
  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y), mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);
}
// Three octaves: each doubles the lattice frequency, so the period of 64 along z is kept.
float fbm(vec3 p) {
  float v = 0.0, a = 0.5;
  v += a * noise(p); p = p * 2.0; a *= 0.5;
  v += a * noise(p); p = p * 2.0; a *= 0.5;
  v += a * noise(p);
  return v / 0.875;
}

// Ridged noise: filaments instead of blobs.
float ridged(vec3 p) { return 1.0 - abs(2.0 * fbm(p) - 1.0); }

float density(vec3 p) {
  // A tube of fog around the flight path, hollow in the middle; the bass swells it, the mids
  // carve finer filaments.
  float r = length(p.xy);
  // The camera wanders within |xy| < 0.5: the fog starts well beyond, so we never fly inside a wall.
  float shell = smoothstep(1.3, 2.6, r) * smoothstep(5.0, 3.4, r);
  float n = ridged(p * 0.5 + vec3(0.0, uTime * 0.02, 0.0));
  float d = (n - 0.72 + 0.12 * uLow) * 3.5;
  d -= 0.6 * noise(p * 3.0) * uMid;
  return clamp(d, 0.0, 1.0) * shell;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float roll = sin(uTime * 0.07) * 0.3;
  uv = mat2(cos(roll), -sin(roll), sin(roll), cos(roll)) * uv;
  vec3 ro = vec3(sin(uTime * 0.13) * 0.4, cos(uTime * 0.11) * 0.3, uDist * SPEED);
  vec3 rd = normalize(vec3(uv, 1.2));

  vec3 tint = thermo(uTone);
  vec3 cold = thermo(clamp(uTone - 0.35, 0.0, 1.0));
  // Kick: a sphere of light left behind at the kick position, expanding and fading.
  float since = (uDist - uHitDist) * SPEED;
  vec3 burst = vec3(0.0, 0.0, uHitDist * SPEED + 3.0);
  float burstR = 0.5 + since * 3.0;

  vec3 col = vec3(0.0);
  float trans = 1.0;
  float t = 0.6;
  for (int i = 0; i < STEPS; i++) {
    vec3 p = ro + rd * t;
    float d = density(p) * smoothstep(0.5, 2.0, t);   // fog fades in ahead of the camera: no white wall
    if (d > 0.001) {
      // Light: a warm core along the axis, plus the kick sphere.
      float core = exp(-length(p.xy) * 0.7);
      float bd = abs(length(p - burst) - burstR);
      float flash = exp(-bd * bd * 4.0) * exp(-since * 0.7) * 3.0;
      // Thin fog glows with the warm palette, dense fog goes dark and cold: that is what gives relief.
      vec3 light = mix(tint * 1.4, cold * 0.25, d) * (0.4 + 1.0 * core) + vec3(1.0, 0.95, 0.85) * flash;
      float a = d * 0.2;
      col += light * a * trans;
      trans *= 1.0 - a;
      if (trans < 0.02) break;
    }
    t += 0.34 + t * 0.04;
  }
  // Stars behind the fog, twinkling with the highs.
  vec3 sp = floor(rd * 180.0 + vec3(0.0, 0.0, uTime * 0.0));
  float star = step(0.994, hash(sp * 7.0 + 3.0)) * (0.4 + uHigh);
  col += vec3(star) * trans * 1.2;
  col += tint * 0.10 * uPunch;
  col = 1.0 - exp(-col * (1.0 + 0.4 * uLevel));
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  GLVisual.start({
    canvas: document.getElementById('c'),
    scale: 0.5,
    period: 64,
    fragment: document.getElementById('fs').textContent.replace('uniform vec2 uRes;', 'uniform vec2 uRes;\n' + GLVisual.THERMO)
  });
}());
</script>
</body>
</html>
