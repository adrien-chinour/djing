<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CITY</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../audio-client.js?v=5"></script>
<script src="../gl-visual.js?v=2"></script>
<script type="x-shader/x-fragment" id="fs">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float uTime, uLevel, uLow, uMid, uHigh, uPunch, uHit, uTone, uDist, uHitDist;
uniform vec2 uRes;

// Night flight over an endless procedural city. Blocks live on a grid of CELL units; the
// camera travels along z with uDist (wraps at 64 = 32 cells, so the city repeats seamlessly).
#define STEPS 64
#define CELL 2.0
#define SPEED 4.0
#define STREET 0.55

// uDist wraps at 64, the camera covers 64 * SPEED / CELL = 128 cells per period: the lattice repeats on 128.
float hashZ(vec2 p) {
  p = vec2(mod(p.x, 512.0), mod(p.y, 128.0));
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

// Height of the block in a cell; avenues every 4th row/column are empty.
float height(vec2 cell) {
  if (mod(cell.x, 4.0) == 0.0 || mod(cell.y, 4.0) == 0.0) return 0.0;
  float h = hashZ(cell);
  return 0.6 + 7.0 * h * h;
}

float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

// Distance to the city: the block of the current cell, bounded by the cell so that the
// march never steps over a neighbour.
float map(vec3 p) {
  vec2 cell = floor(p.xz / CELL);
  vec2 local = p.xz - (cell + 0.5) * CELL;
  float h = height(cell);
  float hw = CELL * 0.5 - STREET * 0.5;   // half width of a block (half is a reserved word in GLSL ES)
  float dBlock = h > 0.0 ? sdBox(vec3(local.x, p.y - h * 0.5, local.y), vec3(hw, h * 0.5, hw)) : 1e5;
  float dGround = p.y;
  // Distance to the cell boundary keeps steps inside the cell (conservative).
  float dEdge = min(CELL * 0.5 - abs(local.x), CELL * 0.5 - abs(local.y)) + 0.001;
  return min(min(dBlock, dGround), max(dEdge, 0.02));
}

vec3 normal(vec3 p) {
  vec2 e = vec2(0.01, 0.0);
  return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float z0 = uDist * SPEED;
  // Camera above the avenue x = 0 (an avenue: cell.x = 0 is empty), banking slowly.
  vec3 ro = vec3(1.0 + sin(uTime * 0.1) * 0.6, 4.5 + 1.2 * sin(uTime * 0.13) + 0.6 * uLow, z0);
  float bank = sin(uTime * 0.1) * 0.12;
  uv = mat2(cos(bank), -sin(bank), sin(bank), cos(bank)) * uv;
  vec3 rd = normalize(vec3(uv.x, uv.y - 0.32, 1.1));

  float t = 0.0, d = 0.0;
  bool hit = false;
  for (int i = 0; i < STEPS; i++) {
    vec3 p = ro + rd * t;
    d = map(p);
    if (d < 0.004 * t) { hit = true; break; }
    t += d;
    if (t > 90.0) break;
  }

  vec3 tint = thermo(uTone);
  vec3 sky = mix(vec3(0.01, 0.01, 0.03), tint * 0.12, pow(max(0.0, 1.0 - rd.y * 2.5), 2.0));
  vec3 col = sky;
  if (hit) {
    vec3 p = ro + rd * t;
    vec3 n = normal(p);
    vec2 cell = floor(p.xz / CELL);
    float h = height(cell);
    // Windows: a grid on the facades, each lit or not, flickering with the highs.
    float win = 0.0;
    if (abs(n.y) < 0.5 && h > 0.0) {
      vec2 fuv = abs(n.x) > 0.5 ? vec2(p.z, p.y) : vec2(p.x, p.y);
      vec2 g = fract(fuv * vec2(2.6, 2.2));
      float frame = step(0.18, g.x) * step(g.x, 0.82) * step(0.2, g.y) * step(g.y, 0.75);
      float lit = step(0.45 - 0.3 * uMid, hashZ(floor(fuv * vec2(2.6, 2.2)) + cell * 13.0));
      float flick = 0.7 + 0.3 * sin(uTime * 7.0 + hashZ(floor(fuv * 3.0)) * 50.0) * uHigh;
      win = frame * lit * flick;
    }
    // Street light: a wave of light sweeps away from the camera on each kick.
    float since = (uDist - uHitDist) * SPEED;
    float waveZ = uHitDist * SPEED + 2.0 + since * 6.0;
    float wave = exp(-abs(p.z - waveZ) * 0.6) * exp(-since * 0.6);
    vec3 facade = tint * 0.06 + vec3(0.02);
    float ground = n.y > 0.5 ? 1.0 : 0.0;
    vec3 glowCol = mix(tint, vec3(1.0, 0.9, 0.7), 0.5);
    col = facade * (0.4 + 0.6 * max(n.y, 0.0)) + glowCol * win * 0.9;
    col += tint * ground * (0.08 + 0.5 * wave) * exp(-length(p.xz - ro.xz) * 0.04);
    col += vec3(1.0, 0.9, 0.7) * wave * 0.35 * (1.0 - ground);
    // Fog thickens with the bass, keeps the horizon soft.
    float fog = 1.0 - exp(-t * (0.03 + 0.02 * uLow));
    col = mix(col, sky, fog);
  }
  col += tint * 0.08 * uPunch;
  col = 1.0 - exp(-col * (1.3 + 0.3 * uLevel));
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  GLVisual.start({
    canvas: document.getElementById('c'),
    scale: 0.5,
    period: 64,
    fragment: document.getElementById('fs').textContent.replace('uniform vec2 uRes;', 'uniform vec2 uRes;\n' + GLVisual.THERMO)
  });
}());
</script>
</body>
</html>
