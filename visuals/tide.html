<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIDE</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var BPS = 160 / 60;
  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H;

  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // Couches de couleur qui balayent l'écran en vagues lentes.
  // Chaque couche est un dégradé radial dont le centre se déplace.
  var LAYERS = 5;
  var layers = [];
  for (var i = 0; i < LAYERS; i++) {
    layers.push({
      hue:    (i * 72) % 360,         // 5 teintes espacées à 72°
      cx:     Math.random(),           // position x normalisée
      cy:     Math.random(),
      vx:     (Math.random() - 0.5) * 0.0003,
      vy:     (Math.random() - 0.5) * 0.0002,
      r:      0.5 + Math.random() * 0.4,
      alpha:  0.28 + Math.random() * 0.18,
      phase:  Math.random() * Math.PI * 2
    });
  }

  var hueShift = 0;

  function drawTide(beat, slow) {
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);

    var diag = Math.sqrt(W * W + H * H);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    for (var i = 0; i < LAYERS; i++) {
      var l = layers[i];

      // Déplacement lent + ondulation
      l.cx += l.vx + Math.sin(beat * 0.07 + l.phase)       * 0.00018;
      l.cy += l.vy + Math.cos(beat * 0.055 + l.phase * 1.3) * 0.00013;

      // Rebond doux
      if (l.cx < 0) l.vx += 0.00005;
      if (l.cx > 1) l.vx -= 0.00005;
      if (l.cy < 0) l.vy += 0.00004;
      if (l.cy > 1) l.vy -= 0.00004;

      var hue = (l.hue + hueShift) % 360;
      var r   = l.r * diag * (0.9 + Math.sin(beat * 0.12 + l.phase) * 0.1);
      var a   = l.alpha + Math.sin(beat * 0.2 + i) * 0.06;
      var cx  = l.cx * W;
      var cy  = l.cy * H;

      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,   'hsla(' + hue + ',85%,60%,' + a.toFixed(2) + ')');
      g.addColorStop(0.5, 'hsla(' + hue + ',80%,45%,' + (a * 0.4).toFixed(2) + ')');
      g.addColorStop(1,   'hsla(' + hue + ',75%,30%,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();

    // Vignette très légère pour garder les bords lisibles pour l'ambilight
    ctx.save();
    var vig = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, diag * 0.5);
    vig.addColorStop(0,   'rgba(0,0,0,0.25)');
    vig.addColorStop(0.6, 'rgba(0,0,0,0.05)');
    vig.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  var beat = 0, slow = 0, last = 0;
  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    beat    += dt * BPS;
    slow    += dt * BPS / 40;
    hueShift = (hueShift + dt * 3) % 360;  // cycle couleur ~2 min
    drawTide(beat, slow);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}());
</script>
</body>
</html>
