<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>AMBILIGHT CALIBRATION</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%;
           image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {

  // ── Rythme ────────────────────────────────────────────────────────────────
  var BPS = 160 / 60;   // beats per second

  // ── Canvas ────────────────────────────────────────────────────────────────
  // On travaille en basse résolution, le CSS étire au plein écran.
  // La grille de pixels fait COLS × ROWS cases — chaque case = un "pixel" affiché.
  var COLS = 80;
  var ROWS = 50;

  var canvas = document.getElementById('c');
  var ctx    = canvas.getContext('2d', { alpha: false });
  canvas.width  = COLS;
  canvas.height = ROWS;

  // ── Palettes néon — [fond, loin, mid, proche, flash] ─────────────────────
  // Chaque palette : 5 couleurs du tunnel de loin (noir) à proche (flash).
  // On interpole entre elles selon la distance.
  var PALETTES = [
    // Synthwave — cyan / magenta
    ['#000000', '#0a001a', '#ff00cc', '#00ffe1', '#ffffff'],
    // Acid — vert / jaune
    ['#000000', '#001a00', '#00ff41', '#ccff00', '#ffffff'],
    // Inferno — rouge / orange
    ['#000000', '#1a0000', '#ff2200', '#ff9900', '#ffffff'],
    // Cobalt — bleu / violet
    ['#000000', '#00001a', '#3300ff', '#cc00ff', '#ffffff'],
    // Rose gold — rose / or
    ['#000000', '#1a0010', '#ff0066', '#ffcc00', '#ffffff'],
  ];

  // Parse hex → [r,g,b]
  function hex(s) {
    var v = parseInt(s.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  // Mélange deux couleurs [r,g,b]
  function lerp3(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  // Pré-calcule les palettes en rgb
  var palRGB = PALETTES.map(function (p) { return p.map(hex); });

  // Couleur pour une distance normalisée d ∈ [0,1] dans la palette p
  function palColor(p, d) {
    var steps = p.length - 1;
    var pos   = d * steps;
    var lo    = Math.min(Math.floor(pos), steps - 1);
    var hi    = lo + 1;
    return lerp3(p[lo], p[hi], pos - lo);
  }

  // ── Transition douce entre palettes ───────────────────────────────────────
  var palIdx    = 0;
  var palNext   = 1;
  var palBlend  = 0;   // 0 = palIdx pur, 1 = palNext pur

  function currentPal(d) {
    var a = palColor(palRGB[palIdx],  d);
    var b = palColor(palRGB[palNext], d);
    return lerp3(a, b, palBlend);
  }

  // ── Tunnel — grille de pixels en perspective ──────────────────────────────
  // Pour chaque pixel (x,y), on calcule :
  //   - l'angle θ autour du centre
  //   - la distance r au centre (perspective : r petit = loin = sombre)
  //   - un offset de profondeur animé → effet scroll vers l'avant
  //
  // On ajoute une légère distorsion sinusoïdale pour casser la rigueur.

  var CX = COLS / 2;
  var CY = ROWS / 2;

  // Pré-calcul des coordonnées polaires pour chaque pixel (fait une fois)
  var pDist  = new Float32Array(COLS * ROWS);
  var pAngle = new Float32Array(COLS * ROWS);

  for (var y = 0; y < ROWS; y++) {
    for (var x = 0; x < COLS; x++) {
      var dx = x - CX + 0.5;
      var dy = (y - CY + 0.5) * (COLS / ROWS);  // aspect correction
      var r  = Math.sqrt(dx * dx + dy * dy);
      pDist [y * COLS + x] = r;
      pAngle[y * COLS + x] = Math.atan2(dy, dx);
    }
  }

  var maxDist = Math.sqrt(CX * CX + CY * CY * (COLS / ROWS) * (COLS / ROWS));

  // imageData pour écrire les pixels directement
  var imgData = ctx.createImageData(COLS, ROWS);
  var pix     = imgData.data;

  function drawTunnel(beat, slow) {
    var scrollZ = beat * 1.2;    // vitesse de scroll vers l'avant (en "unités tunnel")
    var twist   = slow * 0.4;    // rotation lente de tout le tunnel

    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var idx   = y * COLS + x;
        var r     = pDist[idx];
        var angle = pAngle[idx] + twist;

        if (r < 0.5) {
          // pixel exactement au centre → noir
          var base = idx * 4;
          pix[base] = pix[base+1] = pix[base+2] = 0; pix[base+3] = 255;
          continue;
        }

        // Distance normalisée : on mappe 1/r → proche du centre = loin dans le tunnel
        // Le tunnel s'enfonce, donc r petit = profondeur grande
        var depth = 1 / r;

        // Scroll : on décale la profondeur pour créer le mouvement
        var z = (depth * 8 + scrollZ) % 1;   // 0=loin, 1=très proche

        // Distorsion angulaire légère (casse la symétrie)
        var angNorm = (angle / (Math.PI * 2) + slow * 0.15) % 1;
        if (angNorm < 0) angNorm += 1;

        // Bande alternée selon l'angle : effet "couloir" avec des segments
        var stripe = Math.floor(angNorm * 8);   // 8 segments angulaires
        var stripeOff = (stripe % 2) * 0.08;    // décalage de profondeur par segment

        var d = Math.min(1, (z + stripeOff) % 1);

        // Scintillement sur le beat : les pixels proches flashent
        var flash = 0;
        if (d > 0.80) {
          flash = Math.max(0, Math.sin(beat * Math.PI * 2)) * (d - 0.80) * 3;
        }
        d = Math.min(1, d + flash * 0.15);

        // Couleur depuis la palette courante
        var col  = currentPal(d);
        var base = idx * 4;
        pix[base]   = col[0];
        pix[base+1] = col[1];
        pix[base+2] = col[2];
        pix[base+3] = 255;
      }
    }

    ctx.putImageData(imgData, 0, 0);
  }

  // ── Render loop ───────────────────────────────────────────────────────────
  var beat = 0;
  var slow = 0;
  var last = 0;

  // Changement de palette toutes les 16 beats
  var PALETTE_BEATS = 16;
  var nextPalBeat   = PALETTE_BEATS;

  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    beat += dt * BPS;
    slow += dt * BPS / 24;   // slow clock : 1 tour en 24 beats (~9 s)

    // Changement de palette
    if (beat >= nextPalBeat) {
      nextPalBeat = beat + PALETTE_BEATS;
      palBlend    = 0;
      palIdx      = palNext;
      palNext     = (palNext + 1) % PALETTES.length;
    }
    // Transition sur 2 beats
    palBlend = Math.min(1, Math.max(0, (beat - (nextPalBeat - PALETTE_BEATS)) / 2));

    drawTunnel(beat, slow);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

}());
</script>
</body>
</html>
