<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLAR</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {

  var BPS = 160 / 60;
  var TAU = Math.PI * 2;
  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H, CX, CY, DIAG;

  function resize() {
    W    = c.width  = innerWidth;
    H    = c.height = innerHeight;
    CX   = W / 2;
    CY   = H / 2;
    DIAG = Math.sqrt(CX * CX + CY * CY);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ── Analyseur audio — WebSocket vers audio-server.js ─────────────────────
  // Si le serveur n'est pas joignable, fallback automatique sur la simulation.
  // L'adresse pointe vers l'ordi qui fait tourner audio-server.js.
  // La TV atteint l'ordi via son IP locale — on la déduit de l'URL courante.
  var WS_HOST = location.hostname;   // même hôte que le serveur PHP
  var WS_PORT = 8765;

  // Valeurs live (mises à jour par le WebSocket)
  var liveBass   = -1;   // -1 = pas encore de données → fallback simulation
  var liveMid    = 0;
  var liveTreble = 0;
  var liveBeatFlag = false;

  (function connectWS() {
    var ws = new WebSocket('ws://' + WS_HOST + ':' + WS_PORT);
    ws.onmessage = function (e) {
      var d = JSON.parse(e.data);
      liveBass     = d.bass;
      liveMid      = d.mid;
      liveTreble   = d.treble;
      liveBeatFlag = d.beat === 1;
    };
    ws.onclose = function () {
      liveBass = -1;   // repasse en simulation
      setTimeout(connectWS, 3000);   // reconnexion auto
    };
  }());

  // ── Pseudo-bruit déterministe (simulation fallback) ───────────────────────
  function noise(x) {
    var i  = Math.floor(x);
    var f  = x - i;
    var f3 = f * f * (3 - 2 * f);
    return (Math.sin(i * 127.1 + 311.7) * 0.5 + 0.5) * (1 - f3)
         + (Math.sin((i+1) * 127.1 + 311.7) * 0.5 + 0.5) * f3;
  }

  function getSimBass(beat) {
    var kick = Math.pow(Math.max(0, 1 - (beat % 1) * 2.5), 2);
    var bar  = Math.pow(Math.max(0, Math.sin((beat / 4) * TAU * 0.5)), 3) * 0.4;
    return Math.min(1, kick + bar);
  }
  function getSimMid(beat) {
    return 0.3 + Math.sin(beat * TAU * 0.5) * 0.2
               + Math.max(0, Math.sin(beat * TAU)) * 0.3
               + noise(beat * 3.7) * 0.2;
  }
  function getSimTreble(beat) {
    return 0.2 + noise(beat * 11.3) * 0.4
               + Math.max(0, Math.sin(beat * TAU * 2)) * 0.3
               + noise(beat * 7.1 + 100) * 0.1;
  }

  // Retourne {bass, mid, treble} depuis le live ou la simulation
  function getFreqs(beat) {
    if (liveBass >= 0) {
      return { bass: liveBass, mid: liveMid, treble: liveTreble };
    }
    return { bass: getSimBass(beat), mid: getSimMid(beat), treble: getSimTreble(beat) };
  }

  // ── Couleur thermique ─────────────────────────────────────────────────────
  // bass élevé → rouge/orange chaud
  // bass faible + treble élevé → bleu/blanc froid
  // Interpolation : 0=froid (bleu), 1=chaud (rouge/blanc)
  // Gradient : froid=[30,80,255] mid=[80,255,120] chaud=[255,80,10] très chaud=[255,240,180]

  var THERMO = [
    [20,  40,  220],   // 0.00 — bleu électrique froid
    [60,  10,  200],   // 0.15 — violet
    [160, 10,  255],   // 0.30 — violet-magenta
    [255, 30,  80],    // 0.50 — rouge
    [255, 110, 10],    // 0.70 — orange
    [255, 200, 20],    // 0.85 — jaune
    [255, 245, 180],   // 1.00 — blanc chaud
  ];

  function thermoColor(t) {
    // t ∈ [0,1]
    t = Math.max(0, Math.min(1, t));
    var steps = THERMO.length - 1;
    var pos   = t * steps;
    var lo    = Math.min(Math.floor(pos), steps - 1);
    var f     = pos - lo;
    var a     = THERMO[lo], b = THERMO[lo + 1];
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }

  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
  }

  // ── Éclairs électriques ───────────────────────────────────────────────────
  // Un éclair = ligne brisée récursive (lightning) du centre vers l'extrémité.
  // Paramètre "chaos" (0=lisse, 1=électrique) piloté par treble.

  function midpoint(x1, y1, x2, y2, chaos, depth) {
    // Subdivision récursive façon fractale de Koch
    if (depth === 0) return [[x1, y1], [x2, y2]];
    var mx  = (x1 + x2) / 2;
    var my  = (y1 + y2) / 2;
    var dx  = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    // Déviation perpendiculaire
    var dev = (noise(x1 * 0.01 + y1 * 0.007 + depth * 13.7) - 0.5) * len * chaos;
    mx += (-dy / len) * dev;
    my += ( dx / len) * dev;
    var left  = midpoint(x1, y1, mx, my, chaos * 0.72, depth - 1);
    var right = midpoint(mx, my, x2, y2, chaos * 0.72, depth - 1);
    left.pop();
    return left.concat(right).concat([[x2, y2]]);
  }

  // ── Éruptions ─────────────────────────────────────────────────────────────
  var flares = [];

  function spawnFlare(beat, bass, treble) {
    var angle  = Math.random() * TAU;
    // Point de contrôle : déviation latérale organique
    var ctrlDA = (Math.random() - 0.5) * 1.4;
    var dist   = DIAG * (0.90 + Math.random() * 0.2);
    var rise   = 0.5 + Math.random() * 0.4;
    var fall   = 0.6 + Math.random() * 0.6;
    var chaos  = 0.35 + treble * 0.80;    // treble élevé = éclair très brisé
    var width  = (0.018 + bass * 0.05) * DIAG;  // bass = plus épais

    flares.push({
      angle:  angle,
      ctrlDA: ctrlDA,
      dist:   dist,
      chaos:  chaos,
      width:  width,
      rise:   rise,
      fall:   fall,
      born:   beat,
      dead:   false,
      // Pré-calcule les points de l'éclair (statique par éruption)
      pts:    null
    });
  }

  function buildLightning(f) {
    var ex  = CX + Math.cos(f.angle) * f.dist;
    var ey  = CY + Math.sin(f.angle) * f.dist;
    var ca  = f.angle + f.ctrlDA;
    var cpx = CX + Math.cos(ca) * f.dist * 0.45;
    var cpy = CY + Math.sin(ca) * f.dist * 0.45;

    // Échantillonne la courbe de Bézier en segments
    var SEGS = 12;
    var base = [];
    for (var s = 0; s <= SEGS; s++) {
      var t  = s / SEGS;
      var mt = 1 - t;
      base.push([
        mt*mt*CX + 2*mt*t*cpx + t*t*ex,
        mt*mt*CY + 2*mt*t*cpy + t*t*ey
      ]);
    }

    // Applique la fractale d'éclair sur chaque segment
    var pts = [base[0]];
    for (var i = 0; i < base.length - 1; i++) {
      var sub = midpoint(base[i][0], base[i][1], base[i+1][0], base[i+1][1], f.chaos, 4);
      sub.shift();
      pts = pts.concat(sub);
    }

    // Branches secondaires : partent de points le long du tronc
    var branches = [];
    var nBranch  = 2 + Math.round(f.chaos * 4);
    for (var b = 0; b < nBranch; b++) {
      var src  = pts[Math.floor((0.15 + Math.random() * 0.65) * pts.length)];
      var bAng = f.angle + (Math.random() - 0.5) * 1.6;
      var bLen = f.dist  * (0.15 + Math.random() * 0.30);
      var bex  = src[0] + Math.cos(bAng) * bLen;
      var bey  = src[1] + Math.sin(bAng) * bLen;
      var bSub = midpoint(src[0], src[1], bex, bey, f.chaos * 0.8, 3);
      branches.push(bSub);
    }

    return { trunk: pts, branches: branches };
  }

  function drawFlare(f, beat, bass, treble, heat) {
    if (!f.pts) f.pts = buildLightning(f);

    var elapsed = beat - f.born;
    var rising  = elapsed < f.rise;
    var t       = rising
      ? elapsed / f.rise
      : 1 - (elapsed - f.rise) / f.fall;

    if (t <= 0) { f.dead = true; return; }

    var ease   = t * t * (3 - 2 * t);
    var reach  = rising ? t : 1;
    var trunk  = f.pts.trunk;
    var nPts   = Math.round(trunk.length * reach);
    if (nPts < 2) return;

    var cHot   = thermoColor(heat);
    var cCold  = thermoColor(Math.max(0, heat - 0.3));
    var cTip   = thermoColor(Math.min(1, heat + 0.2));

    function strokePath(pts, n, lineW, col, alpha) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth   = lineW;
      ctx.strokeStyle = rgba(col, alpha);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
      ctx.restore();
    }

    // Tronc — halo puis cœur
    strokePath(trunk, nPts, f.width * ease * 3,   cCold, ease * 0.22);
    strokePath(trunk, nPts, Math.max(1.5, f.width * ease * 0.5), cHot, ease * 0.95);

    // Branches secondaires (plus fines, légèrement décalées en fade)
    var branches = f.pts.branches;
    for (var b = 0; b < branches.length; b++) {
      var br   = branches[b];
      var brN  = Math.round(br.length * Math.min(1, reach * 1.3));
      if (brN < 2) continue;
      strokePath(br, brN, f.width * ease * 1.2,  cCold, ease * 0.15);
      strokePath(br, brN, Math.max(1, f.width * ease * 0.25), cHot, ease * 0.70);
    }

    // Halo à l'extrémité (impact sur le bord)
    if (reach > 0.80) {
      var tip   = trunk[nPts - 1];
      var haloA = ease * (reach - 0.80) / 0.20 * 0.7;
      var haloR = f.width * 3.5 * ease;
      var g     = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], haloR);
      g.addColorStop(0,   rgba(cTip,  haloA));
      g.addColorStop(0.4, rgba(cTip,  haloA * 0.3));
      g.addColorStop(1,   rgba(cTip,  0));
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = g;
      ctx.fillRect(tip[0] - haloR, tip[1] - haloR, haloR * 2, haloR * 2);
      ctx.restore();
    }
  }

  // ── Corps de l'étoile ─────────────────────────────────────────────────────
  function drawStar(beat, bass, mid, treble, heat) {
    // Taille : bass pilote la taille de base
    var pulse  = bass * 0.5 + mid * 0.3 + 0.2;
    var baseR  = Math.min(W, H) * (0.07 + bass * 0.09) * (0.8 + pulse * 0.2);
    var cCore  = thermoColor(Math.min(1, heat + 0.15));
    var cMid   = thermoColor(heat);
    var cEdge  = thermoColor(Math.max(0, heat - 0.25));

    // Couronne externe
    var glowR = baseR * (3 + bass * 3);
    var gGlow = ctx.createRadialGradient(CX, CY, baseR * 0.8, CX, CY, glowR);
    gGlow.addColorStop(0,   rgba(cMid,  0.22 * (0.5 + bass * 0.5)));
    gGlow.addColorStop(0.5, rgba(cEdge, 0.08));
    gGlow.addColorStop(1,   rgba(cEdge, 0));
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = gGlow;
    ctx.fillRect(CX - glowR, CY - glowR, glowR * 2, glowR * 2);
    ctx.restore();

    // Corps principal — contour organique animé
    var gBody = ctx.createRadialGradient(CX, CY, 0, CX, CY, baseR);
    gBody.addColorStop(0,    rgba(cCore, 1));
    gBody.addColorStop(0.55, rgba(cMid,  0.95));
    gBody.addColorStop(1,    rgba(cEdge, 0.6));
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = gBody;
    ctx.beginPath();
    var PTS = 72;
    for (var i = 0; i <= PTS; i++) {
      var a = i / PTS * TAU;
      // Distorsion : harmoniques basses = grosse déformation, hautes = texture
      var r = baseR
        * (1
          + 0.06 * Math.sin(a * 2 + beat * TAU * 0.3)  * bass
          + 0.04 * Math.sin(a * 3 + beat * TAU * 0.5)  * mid
          + 0.03 * Math.sin(a * 5 + beat * TAU * 1.1)  * treble
          + 0.02 * Math.sin(a * 7 + beat * TAU * 0.9)  * treble
          + noise(a * 2.3 + beat * 0.4) * 0.03);
      var px = CX + Math.cos(a) * r;
      var py = CY + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Surbrillance centrale
    var specR = baseR * 0.45;
    var gSpec = ctx.createRadialGradient(
      CX - baseR * 0.25, CY - baseR * 0.25, 0,
      CX, CY, specR
    );
    gSpec.addColorStop(0,   rgba([255, 255, 255], 0.65));
    gSpec.addColorStop(1,   rgba([255, 255, 255], 0));
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = gSpec;
    ctx.beginPath(); ctx.arc(CX, CY, baseR, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ── Render ────────────────────────────────────────────────────────────────
  var beat      = 0;
  var last      = 0;
  var lastBeatI = -1;

  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    beat += dt * BPS;

    var freqs  = getFreqs(beat);
    var bass   = freqs.bass;
    var mid    = freqs.mid;
    var treble = freqs.treble;

    // Chaleur thermique : bass dominant, treble refroidit légèrement
    var heat = Math.max(0, Math.min(1, bass * 0.7 + mid * 0.2 - treble * 0.1 + 0.1));

    // Fond : toujours noir strict (pas de trail) — Ambilight apprécie le contraste
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // Spawn éruptions : sur le beat BPM (sim) ou sur le beat détecté (live)
    var spawnNow = false;
    if (liveBass >= 0) {
      // Mode live : on spawn quand le serveur détecte un beat
      if (liveBeatFlag) { spawnNow = true; liveBeatFlag = false; }
    } else {
      // Mode simulation : un beat par entier
      var beatI = Math.floor(beat);
      if (beatI !== lastBeatI) { lastBeatI = beatI; spawnNow = true; }
    }

    var beatI = Math.floor(beat);
    if (beatI !== lastBeatI) lastBeatI = beatI;

    if (spawnNow) {
      spawnFlare(beat, bass, treble);
      if (bass > 0.5 || Math.random() < 0.3) spawnFlare(beat, bass, treble);
      // Nettoyage
      flares = flares.filter(function (f) { return !f.dead; });
      if (flares.length > 24) flares = flares.slice(flares.length - 24);
    }

    // Éruptions
    for (var i = 0; i < flares.length; i++) {
      drawFlare(flares[i], beat, bass, treble, heat);
    }

    // Étoile
    drawStar(beat, bass, mid, treble, heat);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

}());
</script>
</body>
</html>
