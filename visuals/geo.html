<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="audio-client.js?v=2"></script>
<script>
(function () {

  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H, DIAG;

  function resize() {
    W = c.width  = innerWidth;
    H = c.height = innerHeight;
    DIAG = Math.sqrt(W * W + H * H) / 2;
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // ── Thermal palette : 0 = cold (treble-heavy), 1 = warm (bass-heavy) ─────
  var THERMO = [
    [20,  40,  220],
    [60,  10,  200],
    [160, 10,  255],
    [255, 30,  80],
    [255, 110, 10],
    [255, 200, 20],
    [255, 245, 180]
  ];

  function thermoRgb(t) {
    t = Math.max(0, Math.min(1, t));
    var steps = THERMO.length - 1, pos = t * steps;
    var lo = Math.min(Math.floor(pos), steps - 1), f = pos - lo;
    var a = THERMO[lo], b = THERMO[lo + 1];
    return [
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ];
  }

  function rgba(col, a) {
    return 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + a.toFixed(3) + ')';
  }

  // ── Layers ───────────────────────────────────────────────────────────────
  // What drives what (one source per property, so things don't all move together):
  //   colour      ← tone  (spectral balance, drifts over seconds)
  //   size/border ← low   (kick / sub)
  //   opacity     ← mid   (voices, synths)
  //   spin speed  ← high  (hats)
  //   jump        ← punch (attacks only)
  var LAYERS = [
    { base: 0.18, spin:  0.07, phase: 0.0 },
    { base: 0.32, spin: -0.05, phase: 1.1 },
    { base: 0.46, spin:  0.04, phase: 2.3 },
    { base: 0.60, spin: -0.03, phase: 0.7 },
    { base: 0.74, spin:  0.06, phase: 1.8 },
    { base: 0.88, spin: -0.04, phase: 3.0 }
  ];
  for (var i = 0; i < LAYERS.length; i++) LAYERS[i].angle = LAYERS[i].phase;

  function drawLayers(a, elapsed, dt, col) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    for (var i = 0; i < LAYERS.length; i++) {
      var L = LAYERS[i];
      // Integrate angle so a speed change never makes the shape jump
      L.angle += L.spin * (1 + a.high * 1.5) * dt;

      var osc  = Math.sin(elapsed * 0.4 + L.phase * 1.3) * 0.04;
      var grow = Math.min(0.14, osc + a.low * 0.06 + a.punch * 0.08);
      var size = (L.base + grow) * DIAG;

      var inner  = 1 - L.base * 0.5;               // inner squares react a bit more
      var border = 4 + (a.low * 22 + a.punch * 40) * inner;
      var alpha  = Math.min(0.95, 0.25 + a.mid * 0.25 + (1 - L.base) * 0.15 + a.punch * 0.30);

      ctx.save();
      ctx.rotate(L.angle);
      ctx.strokeStyle = rgba(col, alpha);
      ctx.lineWidth   = border;
      ctx.lineJoin    = 'miter';
      ctx.beginPath();
      ctx.rect(-size, -size, size * 2, size * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ── Render ───────────────────────────────────────────────────────────────
  var last = 0, elapsed = 0;

  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    elapsed += dt;

    var a   = AudioFeed.update(dt);
    var col = thermoRgb(a.tone);

    // Background never goes black (14 % floor), breathes with level, flashes on punch
    var lum = 0.14 + a.level * 0.22 + a.punch * 0.22;
    ctx.fillStyle = 'rgb(' +
      Math.round(col[0] * lum) + ',' +
      Math.round(col[1] * lum) + ',' +
      Math.round(col[2] * lum) + ')';
    ctx.fillRect(0, 0, W, H);

    drawLayers(a, elapsed, dt, col);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);

}());
</script>
</body>
</html>
