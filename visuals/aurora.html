<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURORA</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var BPS = 160 / 60;
  var c   = document.getElementById('c');
  var ctx = c.getContext('2d', { alpha: false });
  var W, H;

  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // Rubans d'aurore : chaque ruban est une série de points le long de x,
  // avec une hauteur y animée par des sinus empilés.
  var BANDS = 6;
  var bands = [];
  for (var i = 0; i < BANDS; i++) {
    bands.push({
      hue:    140 + i * 28,          // vert → cyan → violet
      yBase:  0.15 + i * 0.08,       // hauteur de base (haut de l'écran)
      amp:    0.04 + Math.random() * 0.06,
      freq:   0.4 + Math.random() * 0.5,
      phase:  Math.random() * Math.PI * 2,
      alpha:  0.18 + Math.random() * 0.22,
      thick:  0.10 + Math.random() * 0.12,  // épaisseur normalisée
      drift:  (Math.random() - 0.5) * 0.008
    });
  }

  var STEPS = 120;  // points horizontaux par ruban

  function drawAurora(beat, slow) {
    ctx.fillStyle = '#02020a';
    ctx.fillRect(0, 0, W, H);

    for (var b = 0; b < BANDS; b++) {
      var band = bands[b];
      band.phase += 0.004;

      var hue   = (band.hue + slow * 60) % 360;
      var alpha = band.alpha + Math.sin(beat * 0.3 + b) * 0.06;

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // Dessine le ruban comme une forme remplie avec gradient vertical
      ctx.beginPath();
      var pts = [];
      for (var s = 0; s <= STEPS; s++) {
        var nx = s / STEPS;
        var ny = band.yBase
          + Math.sin(nx * Math.PI * band.freq * 2 + band.phase)           * band.amp
          + Math.sin(nx * Math.PI * band.freq * 3.7 + band.phase * 0.7)   * band.amp * 0.4
          + Math.sin(beat * 0.08 + nx * 2.1)                               * band.amp * 0.3;
        pts.push([nx * W, ny * H]);
      }

      // Contour supérieur
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var s = 1; s <= STEPS; s++) ctx.lineTo(pts[s][0], pts[s][1]);

      // Contour inférieur (l'épaisseur donne la traîne vers le bas)
      var thickPx = band.thick * H;
      for (var s = STEPS; s >= 0; s--) {
        var fade = Math.sin(s / STEPS * Math.PI);  // plus épais au centre
        ctx.lineTo(pts[s][0], pts[s][1] + thickPx * (0.5 + fade * 0.5));
      }
      ctx.closePath();

      // Gradient vertical : vif en haut, transparent en bas
      var topY  = Math.min.apply(null, pts.map(function(p){return p[1];}));
      var botY  = topY + thickPx * 1.5;
      var grad  = ctx.createLinearGradient(0, topY, 0, botY);
      grad.addColorStop(0,   'hsla(' + hue + ',90%,65%,' + alpha.toFixed(2) + ')');
      grad.addColorStop(0.4, 'hsla(' + hue + ',85%,55%,' + (alpha * 0.5).toFixed(2) + ')');
      grad.addColorStop(1,   'hsla(' + hue + ',80%,40%,0)');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    // Reflet bas très doux
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    var rg = ctx.createLinearGradient(0, H * 0.7, 0, H);
    rg.addColorStop(0, 'rgba(0,20,15,0)');
    rg.addColorStop(1, 'rgba(0,30,20,0.18)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);
    ctx.restore();
  }

  var beat = 0, slow = 0, last = 0;
  function render(now) {
    if (!last) last = now;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    beat += dt * BPS;
    slow += dt * BPS / 40;
    drawAurora(beat, slow);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}());
</script>
</body>
</html>
