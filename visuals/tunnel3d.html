<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUNNEL 3D</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="audio-client.js?v=3"></script>
<script src="gl-visual.js?v=1"></script>
<script type="x-shader/x-fragment" id="fs">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float uTime, uLevel, uLow, uMid, uHigh, uPunch, uHit, uTone, uDist, uHitDist;
uniform vec2 uRes;

#define STEPS 40
#define SPEED 3.0
// uDist wraps every 64 units (z every 192): all frequencies below are k * 2*pi / 192.
#define F(k) (k * 0.0327249)

// The tunnel axis wanders slowly in x and y as we go deeper.
vec2 path(float z) { return vec2(sin(z * F(7.0)) * 0.9, cos(z * F(5.0)) * 0.7); }

// Signed distance to the wall from inside the tunnel. Radius pulses with the bass.
float map(vec3 p) {
  float radius = 1.0 + 0.15 * uLow;
  return radius - length(p.xy - path(p.z));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float roll = sin(uTime * 0.11) * 0.25;
  uv = mat2(cos(roll), -sin(roll), sin(roll), cos(roll)) * uv;

  float z0 = uDist * SPEED;
  vec3 ro = vec3(path(z0), z0);
  vec3 fwd = normalize(vec3(path(z0 + 1.5), z0 + 1.5) - ro);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  vec3 rd = normalize(fwd * 1.25 + right * uv.x + up * uv.y);

  float t = 0.0, d = 0.0;
  vec3 p = ro;
  for (int i = 0; i < STEPS; i++) {
    p = ro + rd * t;
    d = map(p);
    if (d < 0.003 || t > 40.0) break;
    t += d * 0.9;
  }

  // Wall pattern: rings along the tunnel and stripes around it.
  vec2 off = p.xy - path(p.z);
  float ang = atan(off.y, off.x);
  float rings = smoothstep(0.82, 1.0, abs(sin(p.z * F(92.0))));
  float stripes = smoothstep(0.88, 1.0, abs(sin(ang * 8.0 + p.z * F(12.0))));
  float grid = max(rings, stripes);

  float fog = exp(-t * (0.13 - 0.05 * uMid));       // mids open the view deeper
  vec3 tint = thermo(uTone);
  vec3 col = tint * (0.18 + 0.30 * uMid) * (0.35 + 0.65 * grid);
  col += vec3(1.0) * grid * 0.30 * uHigh;           // highs make the edges sparkle

  // Shock ring emitted by the last kick, travelling away from the camera.
  float since = (uDist - uHitDist) * SPEED;         // tunnel units travelled since the kick
  float ringZ = z0 + 1.0 + since * 2.5;
  float ring = exp(-pow((p.z - ringZ) * 2.5, 2.0)) * exp(-since * 0.5);
  col += vec3(1.0, 0.95, 0.85) * ring * 1.6;

  col *= fog;
  col += tint * 0.12 * uPunch;                       // the whole frame lifts on a kick (Ambilight)
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  GLVisual.start({
    canvas: document.getElementById('c'),
    scale: 1,
    period: 64,
    fragment: document.getElementById('fs').textContent.replace('uniform vec2 uRes;', 'uniform vec2 uRes;\n' + GLVisual.THERMO)
  });
}());
</script>
</body>
</html>
