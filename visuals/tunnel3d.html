<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TUNNEL 3D</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="audio-client.js?v=4"></script>
<script src="gl-visual.js?v=1"></script>
<script type="x-shader/x-fragment" id="fs">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform float uTime, uLevel, uLow, uMid, uHigh, uPunch, uHit, uTone, uDist, uHitDist;
uniform vec2 uRes;

#define SPEED 3.0
// uDist wraps every 64 units (z every 192): all frequencies below are k * 2*pi / 192.
#define F(k) (k * 0.0327249)

// Analytic perspective of an infinite cylinder: one evaluation per pixel (a raymarcher was
// too heavy for the TV GPU). The axis wanders slowly, which bends the tunnel on screen.
vec2 path(float z) { return vec2(sin(z * F(7.0)) * 0.35, cos(z * F(5.0)) * 0.28); }

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float roll = sin(uTime * 0.11) * 0.25;
  uv = mat2(cos(roll), -sin(roll), sin(roll), cos(roll)) * uv;

  float z0 = uDist * SPEED;
  vec2 c = uv - path(z0);
  float r = max(length(c), 0.015);
  float ang = atan(c.y, c.x);
  float radius = 1.0 + 0.15 * uLow;                // the tunnel breathes with the bass
  float depth = radius / r;                         // distance of the wall point ahead of the camera
  float z = z0 + depth;

  // Wall pattern: rings along the tunnel and stripes around it, slightly twisted.
  float rings = smoothstep(0.82, 1.0, abs(sin(z * F(92.0))));
  float stripes = smoothstep(0.88, 1.0, abs(sin(ang * 8.0 + z * F(12.0))));
  float grid = max(rings, stripes);

  float fog = exp(-depth * (0.11 - 0.04 * uMid));  // mids open the view deeper
  vec3 tint = thermo(uTone);
  vec3 col = tint * (0.18 + 0.30 * uMid) * (0.35 + 0.65 * grid);
  col += vec3(1.0) * grid * 0.30 * uHigh;           // highs make the edges sparkle

  // Shock ring emitted by the last kick, travelling away from the camera.
  float since = (uDist - uHitDist) * SPEED;
  float ringDepth = 1.0 + since * 2.5;
  float d = (depth - ringDepth) * 2.5;
  float ring = exp(-d * d) * exp(-since * 0.5);
  col += vec3(1.0, 0.95, 0.85) * ring * 1.6;

  col *= fog;
  col += tint * 0.12 * uPunch;                       // the whole frame lifts on a kick (Ambilight)
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(function () {
  GLVisual.start({
    canvas: document.getElementById('c'),
    scale: 1,
    period: 64,
    fragment: document.getElementById('fs').textContent.replace('uniform vec2 uRes;', 'uniform vec2 uRes;\n' + GLVisual.THERMO)
  });
}());
</script>
</body>
</html>
